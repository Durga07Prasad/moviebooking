# ===========================
# MongoDB Configuration
# ===========================
spring.data.mongodb.uri=mongodb://localhost:27017/moviebooking
spring.data.mongodb.database=moviebooking

# ===========================
# Server Configuration
# ===========================
server.port=8080

# Tomcat Header Size Fix
server.max-http-header-size=65536

# ===========================
# JWT Configuration
# ===========================
jwt.secret=moviebooking_super_secret_key_ooad_project_2024_secure
jwt.expiration=86400000

# ===========================
# App Name
# ===========================
spring.application.name=moviebooking

# ===========================
# CORS Configuration
# ===========================
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# ===========================
# Logging
# ===========================
logging.level.com.project.moviebooking=DEBUG
logging.level.org.springframework.security=INFO

# ===========================
# TMDB API Configuration
# ===========================
tmdb.api.key=3b1676132f0bf249d72c8aa981fe7d69
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.image.base-url=https://image.tmdb.org/t/p/w500

# ===========================
# GST Configuration (Indian Cinema Tax Rules)
# ===========================
gst.rate.high=18.0
gst.rate.low=12.0
gst.threshold=100.0